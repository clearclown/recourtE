# 開発用: podman-compose -f podman-compose.yml up
# 本番用: podman-compose -f podman-compose.prod.yml up -d
# バッチ: podman-compose -f podman-compose.batch.yml run --rm crawler
#         podman-compose -f podman-compose.batch.yml run --rm ingest
services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - libsql-data:/var/lib/sqld:z
    environment:
      - SQLD_NODE=primary

  frontend-dev:
    build:
      context: .
      containerfile: Containerfile
      target: frontend-dev
    ports:
      - "0.0.0.0:3001:3001"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src:z
      - ./packages/database/src:/app/packages/database/src:z
      - ./packages/core/src:/app/packages/core/src:z
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts:z
      - ./apps/frontend/public:/app/apps/frontend/public:z
      - ./packages/database/migrations:/app/packages/database/migrations:z
    environment:
      - TURSO_DATABASE_URL=http://libsql:8080
      - TURSO_AUTH_TOKEN=
    depends_on:
      - libsql

  # ── バッチサービス（init.sh から起動） ──
  crawler:
    build:
      context: .
      containerfile: Containerfile
      target: crawler
    env_file: .env
    environment:
      - TURSO_DATABASE_URL=http://libsql:8080
      - TURSO_AUTH_TOKEN=
    depends_on:
      - libsql
    profiles:
      - batch

  ingest:
    build:
      context: .
      containerfile: Containerfile
      target: ingest
    env_file: .env
    environment:
      - TURSO_DATABASE_URL=http://libsql:8080
      - TURSO_AUTH_TOKEN=
    depends_on:
      - libsql
    profiles:
      - batch

  enrich-judges:
    build:
      context: .
      containerfile: Containerfile
      target: enrich-judges
    env_file: .env
    environment:
      - TURSO_DATABASE_URL=http://libsql:8080
      - TURSO_AUTH_TOKEN=
    depends_on:
      - libsql
    profiles:
      - batch

  generate-comparisons:
    build:
      context: .
      containerfile: Containerfile
      target: generate-comparisons
    env_file: .env
    environment:
      - TURSO_DATABASE_URL=http://libsql:8080
      - TURSO_AUTH_TOKEN=
    depends_on:
      - libsql
    profiles:
      - batch

  scrape-news:
    build:
      context: .
      containerfile: Containerfile
      target: scrape-news
    env_file: .env
    environment:
      - TURSO_DATABASE_URL=http://libsql:8080
      - TURSO_AUTH_TOKEN=
    depends_on:
      - libsql
    profiles:
      - batch

volumes:
  libsql-data:
